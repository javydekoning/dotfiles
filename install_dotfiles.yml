---
# Ansible playbook to install dotfiles
- name: Install dotfiles
  hosts: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    dotfiles_dir: "{{ playbook_dir }}"
    home_dir: "{{ lookup('env', 'HOME') }}"

  tasks:
    # --- Package installation (OS-family conditional) ---
    - name: Install required packages (Debian/Ubuntu)
      become: true
      apt:
        name:
          - git
          - zsh
          - curl
          - vim
          - fzf
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install required packages (Archlinux)
      become: true
      pacman:
        name:
          - git
          - zsh
          - curl
          - vim
          - fzf
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Archlinux"

    - name: Install required packages (macOS)
      homebrew:
        name:
          - ansible
          - aws/tap/eks-node-viewer
          - awscli
          - bentobox
          - caskhub
          - cmux
          - curl
          - deno
          - docker
          - drawio
          - eksctl
          - ffmpeg
          - font-hack-nerd-font
          - fzf
          - gh
          - git
          - go
          - helm
          - jq
          - kubecolor
          - kubectx
          - kubernetes-cli
          - kustomize
          - neohtop
          - node
          - obsidian
          - opentofu
          - p7zip
          - raycast
          - session-manager-plugin
          - shottr
          - signal
          - sublime-text
          - tree
          - uv
          - yq
          - yt-dlp
          - zen
          - zsh
          - zsh-autocomplete
          - zsh-completions
          - zsh-history-substring-search
        state: present
      when: ansible_facts['os_family'] == "Darwin"
      failed_when: false

    # Override manually with: ansible-playbook ... -e work_machine=true  (or =false)
    - name: Detect corporate-managed (work) macOS via Jamf MDM
      stat:
        path: /usr/local/bin/jamf
      register: jamf_binary
      when: ansible_facts['os_family'] == "Darwin"

    - name: Determine whether this is a work machine
      set_fact:
        is_work_mac: "{{ work_machine | default(jamf_binary.stat.exists | default(false)) | bool }}"
      when: ansible_facts['os_family'] == "Darwin"

    - name: Install work-only packages (macOS work machine)
      homebrew:
        name:
          - google-chrome
          - kiro
          - kiro-cli
          - microsoft-auto-update
          - microsoft-excel
          - microsoft-outlook
          - microsoft-powerpoint
          - microsoft-teams
          - microsoft-word
          - slack
          - zoom
        state: present
      when:
        - ansible_facts['os_family'] == "Darwin"
        - is_work_mac | bool
      failed_when: false

    - name: Check if oh-my-zsh is installed
      stat:
        path: "{{ home_dir }}/.oh-my-zsh"
      register: oh_my_zsh_installed

    - name: Install oh-my-zsh
      shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      args:
        creates: "{{ home_dir }}/.oh-my-zsh"
      when: not oh_my_zsh_installed.stat.exists

    - name: Create powerlevel10k theme directory
      file:
        path: "{{ home_dir }}/.oh-my-zsh/custom/themes/powerlevel10k"
        state: directory
        mode: "0755"

    - name: Clone powerlevel10k theme
      git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ home_dir }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1
        update: no

    - name: Create zsh-autosuggestions plugin directory
      file:
        path: "{{ home_dir }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        state: directory
        mode: "0755"

    - name: Clone zsh-autosuggestions plugin
      git:
        repo: https://github.com/zsh-users/zsh-autosuggestions
        dest: "{{ home_dir }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        depth: 1
        update: no

    - name: Create F-Sy-H plugin directory
      file:
        path: "{{ home_dir }}/.oh-my-zsh/custom/plugins/F-Sy-H"
        state: directory
        mode: "0755"

    - name: Clone F-Sy-H (Fast Syntax Highlighting) plugin
      git:
        repo: https://github.com/z-shell/F-Sy-H.git
        dest: "{{ home_dir }}/.oh-my-zsh/custom/plugins/F-Sy-H"
        depth: 1
        update: no

    - name: Create symlinks for dotfiles
      file:
        src: "{{ dotfiles_dir }}/{{ item.src }}"
        dest: "{{ home_dir }}/{{ item.dest }}"
        state: link
        force: yes
      loop:
        - { src: ".zshrc", dest: ".zshrc" }
        - { src: ".fzf.zsh", dest: ".fzf.zsh" }
        - { src: ".vimrc", dest: ".vimrc" }
        - { src: ".tmux.conf", dest: ".tmux.conf" }
        - { src: ".p10k.zsh", dest: ".p10k.zsh" }

    - name: Create custom oh-my-zsh directory
      file:
        path: "{{ home_dir }}/.oh-my-zsh/custom"
        state: directory
        mode: "0755"

    - name: Create Ghostty config directory
      file:
        path: "{{ home_dir }}/.config/ghostty"
        state: directory
        mode: "0755"

    - name: Create symlink for Ghostty config
      file:
        src: "{{ dotfiles_dir }}/ghostty.config"
        dest: "{{ home_dir }}/.config/ghostty/config"
        state: link
        force: yes

    - name: Create symlink for aliases
      file:
        src: "{{ dotfiles_dir }}/aliases.zsh"
        dest: "{{ home_dir }}/.oh-my-zsh/custom/aliases.zsh"
        state: link
        force: yes

    - name: Find zsh binary path
      command: which zsh
      register: zsh_path
      changed_when: false

    - name: Set zsh as default shell
      become: true
      user:
        name: "{{ lookup('env', 'USER') }}"
        shell: "{{ zsh_path.stdout }}"
      when: ansible_facts['user_shell'] != zsh_path.stdout
